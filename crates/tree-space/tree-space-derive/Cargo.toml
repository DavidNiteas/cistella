[package]
name = "tree-space-derive"
version = "0.1.0"
edition = "2024"
authors = ["mzparse contributors"]
description = "compile-time field-registry derive for storing and linking library trees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mzparse/mzparse"
rust-version = "1.95"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }