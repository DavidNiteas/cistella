[package]
name = "cistella-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cistella_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
glob.workspace = true
polars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rust_xlsxwriter.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
lopdf.workspace = true
flate2.workspace = true
zip = "8.6.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "macros"] }
percent-encoding = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "std"] }
