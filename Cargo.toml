[workspace]
members = [
  "crates/openalex-analysis-core",
  "crates/openalex-analysis-studio/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = ""

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
polars = { version = "0.55.2", features = ["lazy", "parquet", "ipc", "json", "strings", "regex", "dtype-struct", "dtype-array", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rust_xlsxwriter = "0.99.0"
tauri = "2.11.5"
tauri-build = "2.5.3"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
panic = "abort"
